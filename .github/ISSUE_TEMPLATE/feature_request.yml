name: Feature request
description: Suggest an improvement or new capability
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep the plugin small: readability, tests, and minimal dependencies matter more than feature count.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to change? Any alternatives considered?
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Extra context
      description: Links, screenshots (redacted), or related issues.
