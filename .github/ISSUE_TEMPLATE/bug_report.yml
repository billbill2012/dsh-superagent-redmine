name: Bug report
description: Something is broken or behaves unexpectedly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never paste API keys, passwords, or private Redmine URLs.**
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Node.js, DSH, dsh-superagent, and Redmine versions if known
      placeholder: "Node 22 / DSH 0.2.1-rc.3 / Redmine 6.1"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Redact hostnames and secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted health/detail text or logs if useful.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `pnpm check` locally (or explain why not)
        - label: This report contains no API keys or credentials
